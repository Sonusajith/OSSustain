spring:
  application:
    name: ossustain-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ossustain}
    username: ${POSTGRES_USER:ossustain}
    password: ${POSTGRES_PASSWORD:ossustain-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      tracking-modes: cookie

ossustain:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    bootstrap-admin-username: ${OSSUSTAIN_ADMIN_USERNAME:}
    bootstrap-admin-password: ${OSSUSTAIN_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
