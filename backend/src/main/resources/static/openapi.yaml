openapi: 3.1.0
info:
  title: OSSustain API
  version: 1.0.0
  description: Public research reads, authenticated analysis, and role-protected administration.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          description: Session CSRF token for browser requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
  /auth/login:
    post:
      operationId: login
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed-in account profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      operationId: getCurrentUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current account profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password:
    post:
      operationId: changePassword
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '200':
          description: Updated account profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/logout:
    post:
      operationId: logout
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: Session ended.}
  /admin/users:
    get:
      operationId: listAdminUsers
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Page of accounts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAdminUser
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Account and one-time temporary password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedUser'}
  /admin/users/{id}/enabled:
    patch:
      operationId: setUserEnabled
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetEnabledRequest'}
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/analyses:
    get:
      operationId: listAdminAnalyses
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Page of recent analysis jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAnalysisPage'}
  /admin/analyses/{id}/cancel:
    post:
      operationId: cancelAdminAnalysis
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: Canceled analysis job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '409': {$ref: '#/components/responses/Conflict'}
  /analyses:
    post:
      operationId: submitAnalysis
      summary: Queue a bounded analysis of a public GitHub repository.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalysisRequest'}
      responses:
        '202':
          description: Analysis accepted or an existing active/cached result returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429':
          description: Submission quota reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: Queue temporarily full.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /analyses/{id}:
    get:
      operationId: getAnalysis
      security: [{sessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Job status and completed result, if available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '404': {$ref: '#/components/responses/NotFound'}
  /:
    get:
      operationId: getApiIndex
      summary: Discover API resources and the local dashboard URL.
      responses:
        '200':
          description: API resource links and dashboard instructions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiIndex'}
  /repositories:
    get:
      operationId: listRepositories
      parameters:
        - {name: risk, in: query, schema: {type: string, enum: [low, medium, high]}}
        - {name: sizeGroup, in: query, schema: {type: string, enum: [small, medium, large]}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: sort, in: query, schema: {type: string, enum: [fullName, stars, riskCategory, predictionDate], default: fullName}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        '200':
          description: A page of repositories in the latest cohort.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /compare:
    get:
      operationId: compareRepositories
      summary: Compare 2–4 repositories from the latest cohort.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: Two to four distinct repository IDs, in the desired comparison order.
          schema:
            type: array
            minItems: 2
            maxItems: 4
            uniqueItems: true
            items: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Repository summaries and each repository's latest stored monthly metrics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryComparison'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /repositories/{id}:
    parameters:
      - {$ref: '#/components/parameters/RepositoryId'}
    get:
      operationId: getRepository
      responses:
        '200':
          description: Repository metadata and quality flags.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /repositories/{id}/metrics:
    parameters:
      - {$ref: '#/components/parameters/RepositoryId'}
    get:
      operationId: getRepositoryMetrics
      responses:
        '200':
          description: Monthly metrics and completeness records.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MetricPoint'}
        '404': {$ref: '#/components/responses/NotFound'}
  /repositories/{id}/predictions:
    parameters:
      - {$ref: '#/components/parameters/RepositoryId'}
    get:
      operationId: getRepositoryPredictionHistory
      responses:
        '200':
          description: Predictions ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Prediction'}
        '404': {$ref: '#/components/responses/NotFound'}
  /repositories/{id}/predictions/latest:
    parameters:
      - {$ref: '#/components/parameters/RepositoryId'}
    get:
      operationId: getLatestRepositoryPrediction
      responses:
        '200':
          description: Latest prediction with ranked indicators.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /research/models:
    get:
      operationId: listModels
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/ResearchPageSize'}
      responses:
        '200':
          description: Model versions for the latest dataset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /research/evaluations:
    get:
      operationId: listEvaluations
      parameters:
        - {name: split, in: query, schema: {type: string, enum: [train, validation, test]}}
        - {name: featureSet, in: query, schema: {type: string, enum: [activity_only, extended]}}
        - {name: stratum, in: query, schema: {type: string, enum: [overall, small, medium, large]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/ResearchPageSize'}
      responses:
        '200':
          description: Stored evaluation metrics and confidence intervals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /research/feature-importance:
    get:
      operationId: listFeatureImportance
      parameters:
        - {name: modelVersionId, in: query, schema: {type: integer, minimum: 1}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/ResearchPageSize'}
      responses:
        '200':
          description: Global importance values for the latest dataset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureImportancePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /research/dataset-summary:
    get:
      operationId: getDatasetSummary
      responses:
        '200':
          description: Counts, prevalence, and quality summary for the latest dataset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /research/label-definition:
    get:
      operationId: getLabelDefinition
      responses:
        '200':
          description: Label parameters, split dates, and feature dictionary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabelDefinition'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    RepositoryId:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
    ResearchPageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    BadRequest:
      description: Invalid query parameter.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Sign-in required or credentials were rejected.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: The account does not have permission for this operation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Request conflicts with current account or job state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: {type: string}
        parameterName: {type: string}
        token: {type: string}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 100}
        password: {type: string, minLength: 1, maxLength: 200}
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 200}
        newPassword: {type: string, minLength: 16, maxLength: 200}
    CurrentUser:
      type: object
      required: [id, username, roles, mustChangePassword]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        roles: {type: array, items: {type: string, enum: [ADMIN, RESEARCHER]}}
        mustChangePassword: {type: boolean}
    CreateUserRequest:
      type: object
      required: [username, role]
      properties:
        username: {type: string, minLength: 3, maxLength: 100}
        role: {type: string, enum: [ADMIN, RESEARCHER]}
    SetEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    AdminUser:
      type: object
      required: [id, username, roles, enabled, mustChangePassword, createdAt]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        roles: {type: array, items: {type: string}}
        enabled: {type: boolean}
        mustChangePassword: {type: boolean}
        createdAt: {type: string, format: date-time}
    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: {$ref: '#/components/schemas/AdminUser'}
        temporaryPassword: {type: string}
    AdminUserPage:
      type: object
      required: [content, page, pageSize, totalElements]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}
        page: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer, format: int64}
    AdminAnalysis:
      type: object
      required: [id, repository, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        repository: {type: string}
        status: {type: string}
        submittedBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null']}
    AdminAnalysisPage:
      type: object
      required: [content, page, pageSize, totalElements]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/AdminAnalysis'}}
        page: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer, format: int64}
    AnalysisRequest:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$'
    Analysis:
      type: object
      required: [id, repository, status, requestsUsed, createdAt, result]
      properties:
        id: {type: string, format: uuid}
        repository: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        requestsUsed: {type: integer, minimum: 0, maximum: 300}
        errorCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        result:
          oneOf:
            - {$ref: '#/components/schemas/AnalysisResult'}
            - {type: 'null'}
    AnalysisResult:
      type: object
      required: [modelVersionId, probability, riskCategory, predictionDate, featureSet, algorithm, limitations, features, indicators, requestsUsed, completedAt]
      properties:
        modelVersionId: {type: integer, format: int64}
        probability: {type: number, minimum: 0, maximum: 1}
        riskCategory: {type: string, enum: [low, medium, high]}
        predictionDate: {type: string, format: date}
        featureSet: {type: string}
        algorithm: {type: string}
        limitations: {type: array, items: {type: string}}
        features: {type: object, additionalProperties: {type: [number, 'null']}}
        indicators: {type: array, items: {type: object, additionalProperties: true}}
        requestsUsed: {type: integer, minimum: 1, maximum: 300}
        completedAt: {type: string, format: date-time}
    ApiIndex:
      type: object
      required: [service, version, dashboard, endpoints]
      properties:
        service: {type: string}
        version: {type: string}
        dashboard: {type: string}
        endpoints:
          type: object
          additionalProperties: {type: string}
    ApiError:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        path: {type: string}
    PageMetadata:
      type: object
      required: [page, pageSize, totalElements, totalPages]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    RepositoryPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: {$ref: '#/components/schemas/RepositorySummary'}
    RepositorySummary:
      type: object
      required: [id, fullName, owner, name, sizeGroup, stars, dataQualityFlags, latestProbability, latestRiskCategory, predictionDate]
      properties:
        id: {type: integer, format: int64}
        fullName: {type: string}
        owner: {type: string}
        name: {type: string}
        sizeGroup: {type: string}
        stars: {type: integer, format: int64}
        dataQualityFlags: {type: array, items: {type: string}}
        latestProbability: {type: [number, 'null']}
        latestRiskCategory: {type: [string, 'null']}
        predictionDate: {type: [string, 'null'], format: date}
    RepositoryComparison:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          minItems: 2
          maxItems: 4
          items: {$ref: '#/components/schemas/RepositoryComparisonEntry'}
    RepositoryComparisonEntry:
      type: object
      required: [repository, latestMetrics]
      properties:
        repository: {$ref: '#/components/schemas/RepositorySummary'}
        latestMetrics:
          oneOf:
            - {$ref: '#/components/schemas/MetricPoint'}
            - type: 'null'
    RepositoryDetail:
      type: object
      required: [id, githubId, fullName, owner, name, defaultBranch, createdAt, stars, sizeGroup, primaryLanguage, archived, fork, metadata, dataQualityFlags]
      properties:
        id: {type: integer, format: int64}
        githubId: {type: integer, format: int64}
        fullName: {type: string}
        owner: {type: string}
        name: {type: string}
        defaultBranch: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        stars: {type: integer, format: int64}
        sizeGroup: {type: string}
        primaryLanguage: {type: [string, 'null']}
        archived: {type: boolean}
        fork: {type: boolean}
        metadata: {type: object}
        dataQualityFlags: {type: array, items: {type: string}}
    MetricPoint:
      type: object
      required: [predictionDate, metrics, completeness]
      properties:
        predictionDate: {type: string, format: date}
        metrics: {type: object}
        completeness: {type: object}
    Prediction:
      type: object
      required: [id, repositoryId, snapshotId, datasetVersionId, datasetVersionHash, modelVersionId, algorithm, featureSet, probability, riskCategory, predictionDate, limitationFlags]
      properties:
        id: {type: integer, format: int64}
        repositoryId: {type: integer, format: int64}
        snapshotId: {type: integer, format: int64}
        datasetVersionId: {type: integer, format: int64}
        datasetVersionHash: {type: string}
        modelVersionId: {type: integer, format: int64}
        algorithm: {type: string}
        featureSet: {type: string}
        probability: {type: number}
        riskCategory: {type: string, enum: [low, medium, high]}
        predictionDate: {type: string, format: date}
        limitationFlags: {type: array, items: {type: string}}
    PredictionDetail:
      type: object
      required: [prediction, indicators]
      properties:
        prediction: {$ref: '#/components/schemas/Prediction'}
        indicators:
          type: array
          items:
            type: object
            required: [method, featureName, featureValue, referenceValue, probabilityDelta, direction, rank, description]
            properties:
              method: {type: string, enum: [shap, local_substitution]}
              featureName: {type: string}
              featureValue: {type: [number, 'null']}
              referenceValue: {type: [number, 'null']}
              probabilityDelta: {type: number}
              direction: {type: string}
              rank: {type: integer}
              description: {type: string}
    ModelPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          properties:
            content: {type: array, items: {$ref: '#/components/schemas/ModelVersion'}}
    ModelVersion:
      type: object
      required: [id, datasetVersionId, datasetVersionHash, featureSetId, featureSet, algorithm, parameters, seed, validationThreshold, riskLowCutoff, riskHighCutoff, selected, codeRevision, trainedAt]
      properties:
        id: {type: integer, format: int64}
        datasetVersionId: {type: integer, format: int64}
        datasetVersionHash: {type: string}
        featureSetId: {type: integer, format: int64}
        featureSet: {type: string}
        algorithm: {type: string}
        parameters: {type: object, additionalProperties: true}
        seed: {type: integer}
        validationThreshold: {type: number}
        riskLowCutoff: {type: [number, 'null']}
        riskHighCutoff: {type: [number, 'null']}
        selected: {type: boolean}
        codeRevision: {type: [string, 'null']}
        trainedAt: {type: [string, 'null'], format: date-time}
    EvaluationPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          properties:
            content: {type: array, items: {$ref: '#/components/schemas/Evaluation'}}
    Evaluation:
      type: object
      required: [modelVersionId, featureSet, algorithm, split, stratum, metric, value, ciLow, ciHigh, details]
      properties:
        modelVersionId: {type: integer, format: int64}
        featureSet: {type: string}
        algorithm: {type: string}
        split: {type: string}
        stratum: {type: string}
        metric: {type: string}
        value: {type: [number, 'null']}
        ciLow: {type: [number, 'null']}
        ciHigh: {type: [number, 'null']}
        details: {type: object, additionalProperties: true}
    FeatureImportancePage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          properties:
            content: {type: array, items: {$ref: '#/components/schemas/FeatureImportance'}}
    FeatureImportance:
      type: object
      required: [modelVersionId, featureSet, algorithm, method, featureName, value, rank]
      properties:
        modelVersionId: {type: integer, format: int64}
        featureSet: {type: string}
        algorithm: {type: string}
        method: {type: string}
        featureName: {type: string}
        value: {type: number}
        rank: {type: integer}
    DatasetSummary:
      type: object
      required: [id, versionHash, cohortName, createdAt, summary]
      properties:
        id: {type: integer, format: int64}
        versionHash: {type: string}
        cohortName: {type: string}
        createdAt: {type: string, format: date-time}
        summary: {type: object}
    LabelDefinition:
      type: object
      required: [datasetVersionId, datasetVersionHash, label, splits, protocol, featureDictionary]
      properties:
        datasetVersionId: {type: integer, format: int64}
        datasetVersionHash: {type: string}
        label: {type: object}
        splits: {type: object}
        protocol: {type: object}
        featureDictionary: {type: array, items: {$ref: '#/components/schemas/FeatureDefinition'}}
    FeatureDefinition:
      type: object
      required: [featureName, featureGroup, description, timeWindow, missingPolicy]
      properties:
        featureName: {type: string}
        featureGroup: {type: string}
        description: {type: string}
        timeWindow: {type: string}
        missingPolicy: {type: string}
