name: ossustain-production

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env.production}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env.production}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in deploy/.env.production}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in deploy/.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 4s
      start_period: 45s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/_health"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  db-backup:
    image: postgres:16.15
    profiles: [ops]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-db.sh"]

  db-restore:
    image: postgres:16.15
    profiles: [ops]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTORE_DATABASE: ${RESTORE_DATABASE:-}
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups:ro"
      - ./scripts/restore-db.sh:/usr/local/bin/restore-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/restore-db.sh"]

volumes:
  postgres-data:
