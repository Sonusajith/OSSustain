services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ossustain}
      POSTGRES_USER: ${POSTGRES_USER:-ossustain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ossustain-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ossustain} -d ${POSTGRES_DB:-ossustain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analysis-worker:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-ossustain}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ossustain-local}
      PGDATABASE: ${POSTGRES_DB:-ossustain}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OSSUSTAIN_HASH_SECRET: ${OSSUSTAIN_HASH_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pipeline/artifacts:/app/pipeline/artifacts:ro
    command: ["worker"]

volumes:
  postgres-data:
