[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ossustain-pipeline"
version = "0.1.0"
description = "Foundation CLI for the OSSustain research pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.14.3",
]

[project.scripts]
ossustain-pipeline = "ossustain_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
